<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">地面数据中心与 SpaceX 轨道计算的瓶颈替代路径</title>
  <desc id="desc">上半部分为地面数据中心的算力部署与结果交付路径，下半部分为 SpaceX 轨道计算替代路径。半导体是两条路径的共同依赖。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      text{font-family:Arial,"Noto Sans SC","PingFang SC",sans-serif;fill:#172033}
      .section{font-size:20px;font-weight:700}.note{font-size:16px;fill:#64748b}.lane{font-size:17px;font-weight:700;fill:#475569}
      .node-label{font-size:18px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.legend{font-size:15px;fill:#475569}
      .current-badge{fill:#fed7aa;stroke:#c2410c;stroke-width:2}.alt-badge{fill:#f3e8ff;stroke:#7c3aed;stroke-width:2;stroke-dasharray:8 6}
      .shared{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.current{fill:#fed7aa;stroke:#c2410c;stroke-width:2}.dependency{fill:#fef3c7;stroke:#a16207;stroke-width:2}
      .alternative{fill:#f3e8ff;stroke:#7c3aed;stroke-width:2;stroke-dasharray:8 6}.edge{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
      .alt-edge{fill:none;stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow-purple)}
    </style>
  </defs>

  <rect width="1600" height="760" fill="#f8fafc"/>
  <rect x="30" y="28" width="210" height="46" rx="10" class="current-badge" filter="url(#shadow)"/>
  <text x="135" y="52" class="section" text-anchor="middle" dominant-baseline="middle">地面当前路径</text>
  <text x="260" y="55" class="note">依赖多个产业同时扩张</text>

  <text x="30" y="135" class="lane">算力部署</text>
  <text x="30" y="285" class="lane">结果交付</text>

  <rect x="170" y="105" width="210" height="60" rx="10" class="shared" filter="url(#shadow)"/>
  <text x="275" y="136" class="node-label">半导体</text>
  <rect x="440" y="105" width="270" height="60" rx="10" class="current" filter="url(#shadow)"/>
  <text x="575" y="136" class="node-label">数据中心</text>
  <path d="M380 135H440" class="edge"/>

  <rect x="350" y="200" width="450" height="54" rx="10" class="dependency"/>
  <text x="575" y="228" class="node-label">发电与电网 · 配电 · 制冷 · 设施</text>
  <path d="M575 200V171" class="edge"/>

  <rect x="800" y="255" width="180" height="60" rx="10" class="current" filter="url(#shadow)"/>
  <text x="890" y="286" class="node-label">DCI</text>
  <rect x="1040" y="255" width="180" height="60" rx="10" class="current" filter="url(#shadow)"/>
  <text x="1130" y="286" class="node-label">骨干网</text>
  <rect x="1280" y="255" width="230" height="60" rx="10" class="current" filter="url(#shadow)"/>
  <text x="1395" y="286" class="node-label">CDN · Edge</text>
  <path d="M710 135H755V285H800" class="edge"/>
  <path d="M980 285H1040" class="edge"/>
  <path d="M1220 285H1280" class="edge"/>

  <line x1="30" y1="370" x2="1570" y2="370" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="30" y="405" width="210" height="46" rx="10" class="alt-badge" filter="url(#shadow)"/>
  <text x="135" y="429" class="section" text-anchor="middle" dominant-baseline="middle">SpaceX 替代路径</text>
  <text x="260" y="432" class="note">把工程项目改写成制造与发射吞吐</text>

  <text x="30" y="525" class="lane">算力部署</text>
  <text x="30" y="670" class="lane">结果交付</text>

  <rect x="170" y="495" width="210" height="60" rx="10" class="shared" filter="url(#shadow)"/>
  <text x="275" y="526" class="node-label">半导体</text>
  <rect x="440" y="495" width="270" height="60" rx="10" class="alternative" filter="url(#shadow)"/>
  <text x="575" y="526" class="node-label">计算卫星</text>
  <rect x="800" y="495" width="250" height="60" rx="10" class="alternative" filter="url(#shadow)"/>
  <text x="925" y="526" class="node-label">Starship</text>
  <rect x="1120" y="495" width="230" height="60" rx="10" class="alternative" filter="url(#shadow)"/>
  <text x="1235" y="526" class="node-label">轨道部署</text>
  <path d="M380 525H440" class="alt-edge"/>
  <path d="M710 525H800" class="alt-edge"/>
  <path d="M1050 525H1120" class="alt-edge"/>

  <rect x="440" y="640" width="270" height="60" rx="10" class="alternative"/>
  <text x="575" y="671" class="node-label">太阳能阵列 · 散热器</text>
  <path d="M575 640V561" class="alt-edge"/>

  <rect x="800" y="640" width="250" height="60" rx="10" class="alternative" filter="url(#shadow)"/>
  <text x="925" y="671" class="node-label">Starlink 激光网络</text>
  <rect x="1120" y="640" width="230" height="60" rx="10" class="alternative" filter="url(#shadow)"/>
  <text x="1235" y="671" class="node-label">地面网络</text>
  <path d="M710 525H755V670H800" class="alt-edge"/>
  <path d="M1050 670H1120" class="alt-edge"/>

  <line x1="1090" y1="430" x2="1140" y2="430" class="edge"/><text x="1153" y="435" class="legend">当前依赖</text>
  <line x1="1240" y1="430" x2="1290" y2="430" class="alt-edge"/><text x="1303" y="435" class="legend">替代路径</text>
  <rect x="1395" y="421" width="24" height="18" rx="4" class="shared"/><text x="1430" y="435" class="legend">共同依赖</text>
</svg>

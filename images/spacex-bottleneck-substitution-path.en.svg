<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Bottleneck substitution from terrestrial data centers to SpaceX orbital compute</title>
  <desc id="desc">The upper half shows terrestrial compute deployment and result delivery. The lower half shows the SpaceX orbital alternative. Semiconductors remain a shared dependency.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      text{font-family:Arial,"Noto Sans",sans-serif;fill:#172033}
      .section{font-size:20px;font-weight:700}.note{font-size:16px;fill:#64748b}.lane{font-size:15px;font-weight:700;fill:#475569}
      .node-label{font-size:17px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.legend{font-size:15px;fill:#475569}
      .current-badge{fill:#fed7aa;stroke:#c2410c;stroke-width:2}.alt-badge{fill:#f3e8ff;stroke:#7c3aed;stroke-width:2;stroke-dasharray:8 6}
      .shared{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.current{fill:#fed7aa;stroke:#c2410c;stroke-width:2}.dependency{fill:#fef3c7;stroke:#a16207;stroke-width:2}
      .alternative{fill:#f3e8ff;stroke:#7c3aed;stroke-width:2;stroke-dasharray:8 6}.edge{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
      .alt-edge{fill:none;stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow-purple)}
    </style>
  </defs>

  <rect width="1600" height="760" fill="#f8fafc"/>
  <rect x="30" y="28" width="280" height="46" rx="10" class="current-badge" filter="url(#shadow)"/>
  <text x="170" y="52" class="section" text-anchor="middle" dominant-baseline="middle">TERRESTRIAL PATH</text>
  <text x="330" y="55" class="note">Several industries must scale together</text>

  <text x="30" y="135" class="lane">COMPUTE DEPLOYMENT</text>
  <text x="30" y="285" class="lane">RESULT DELIVERY</text>

  <rect x="230" y="105" width="210" height="60" rx="10" class="shared" filter="url(#shadow)"/>
  <text x="335" y="136" class="node-label">SEMICONDUCTORS</text>
  <rect x="500" y="105" width="270" height="60" rx="10" class="current" filter="url(#shadow)"/>
  <text x="635" y="136" class="node-label">DATA CENTER</text>
  <path d="M440 135H500" class="edge"/>

  <rect x="370" y="200" width="530" height="54" rx="10" class="dependency"/>
  <text x="635" y="228" class="node-label">GENERATION · GRID · DISTRIBUTION · COOLING · FACILITIES</text>
  <path d="M635 200V171" class="edge"/>

  <rect x="860" y="255" width="160" height="60" rx="10" class="current" filter="url(#shadow)"/>
  <text x="940" y="286" class="node-label">DCI</text>
  <rect x="1080" y="255" width="180" height="60" rx="10" class="current" filter="url(#shadow)"/>
  <text x="1170" y="286" class="node-label">BACKBONE</text>
  <rect x="1320" y="255" width="230" height="60" rx="10" class="current" filter="url(#shadow)"/>
  <text x="1435" y="286" class="node-label">CDN · EDGE</text>
  <path d="M770 135H810V285H860" class="edge"/>
  <path d="M1020 285H1080" class="edge"/>
  <path d="M1260 285H1320" class="edge"/>

  <line x1="30" y1="370" x2="1570" y2="370" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="30" y="405" width="280" height="46" rx="10" class="alt-badge" filter="url(#shadow)"/>
  <text x="170" y="429" class="section" text-anchor="middle" dominant-baseline="middle">SPACEX ALTERNATIVE</text>
  <text x="330" y="432" class="note">Turn project delivery into manufacturing and launch throughput</text>

  <text x="30" y="525" class="lane">COMPUTE DEPLOYMENT</text>
  <text x="30" y="670" class="lane">RESULT DELIVERY</text>

  <rect x="230" y="495" width="210" height="60" rx="10" class="shared" filter="url(#shadow)"/>
  <text x="335" y="526" class="node-label">SEMICONDUCTORS</text>
  <rect x="500" y="495" width="270" height="60" rx="10" class="alternative" filter="url(#shadow)"/>
  <text x="635" y="526" class="node-label">COMPUTE SATELLITE</text>
  <rect x="860" y="495" width="250" height="60" rx="10" class="alternative" filter="url(#shadow)"/>
  <text x="985" y="526" class="node-label">STARSHIP</text>
  <rect x="1180" y="495" width="230" height="60" rx="10" class="alternative" filter="url(#shadow)"/>
  <text x="1295" y="526" class="node-label">ORBIT</text>
  <path d="M440 525H500" class="alt-edge"/>
  <path d="M770 525H860" class="alt-edge"/>
  <path d="M1110 525H1180" class="alt-edge"/>

  <rect x="500" y="640" width="270" height="60" rx="10" class="alternative"/>
  <text x="635" y="671" class="node-label">SOLAR ARRAY · RADIATOR</text>
  <path d="M635 640V561" class="alt-edge"/>

  <rect x="860" y="640" width="250" height="60" rx="10" class="alternative" filter="url(#shadow)"/>
  <text x="985" y="671" class="node-label">STARLINK LASER NETWORK</text>
  <rect x="1180" y="640" width="230" height="60" rx="10" class="alternative" filter="url(#shadow)"/>
  <text x="1295" y="671" class="node-label">TERRESTRIAL NETWORK</text>
  <path d="M770 525H815V670H860" class="alt-edge"/>
  <path d="M1110 670H1180" class="alt-edge"/>

  <line x1="1040" y1="430" x2="1090" y2="430" class="edge"/><text x="1103" y="435" class="legend">Current</text>
  <line x1="1190" y1="430" x2="1240" y2="430" class="alt-edge"/><text x="1253" y="435" class="legend">Alternative</text>
  <rect x="1380" y="421" width="24" height="18" rx="4" class="shared"/><text x="1415" y="435" class="legend">Shared dependency</text>
</svg>

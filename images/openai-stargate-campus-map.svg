<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI 自 2023 年以来的美国数据中心交付状态</title>
  <desc id="desc">美国本土地图标出九座公开位置的数据中心 campus。绿色代表已有容量投入使用，橙色代表建设中，蓝色代表已签约但尚未开工。圆面积按公开的最终容量缩放。OpenAI 的既有可用算力只公布年度合计，未披露站点拆分。</desc>

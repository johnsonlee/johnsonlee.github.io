<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenAI 算力需求下两条部署路线的交叉点</title>
  <desc id="desc">概念图比较随着 OpenAI 目标算力从 10GW 增长到 100GW，地面数据中心和 SpaceX 轨道计算两条路线的边际 Time-to-Compute。30 到 50GW 是两条路线可能出现交叉的观察区间。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter>
    <style>
      text{font-family:Arial,"Noto Sans SC","PingFang SC",sans-serif;fill:#172033}
      .axis{fill:none;stroke:#64748b;stroke-width:2}.grid{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:5 7}.tick{font-size:17px;font-weight:700;text-anchor:middle}.tick-sub{font-size:14px;fill:#64748b;text-anchor:middle}.axis-label{font-size:18px;font-weight:700;fill:#475569;text-anchor:middle}.direction{font-size:15px;font-weight:700;fill:#64748b;text-anchor:middle}
      .current-line{fill:none;stroke:#c2410c;stroke-width:7;stroke-linecap:round}.orbital-line{fill:none;stroke:#7c3aed;stroke-width:7;stroke-linecap:round;stroke-dasharray:18 12}.route-label{font-size:18px;font-weight:700}.note{font-size:16px;fill:#475569}.zone-title{font-size:20px;font-weight:700;fill:#991b1b;text-anchor:middle}.zone-sub{font-size:15px;font-weight:700;fill:#9f1239;text-anchor:middle}.legend{font-size:16px;fill:#475569}.callout-title{font-size:17px;font-weight:700;fill:#172033;text-anchor:middle}.callout-sub{font-size:15px;fill:#475569;text-anchor:middle}.footnote{font-size:14px;fill:#64748b;text-anchor:middle}
    </style>
  </defs>

  <rect width="1600" height="760" fill="#f8fafc"/>

  <rect x="568" y="74" width="300" height="490" rx="16" fill="#ffe4e6" opacity="0.78"/>
  <line x1="568" y1="74" x2="568" y2="564" stroke="#fda4af" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="868" y1="74" x2="868" y2="564" stroke="#fda4af" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="718" y="108" class="zone-title">30–50GW · 交叉观察区</text>
  <text x="718" y="134" class="zone-sub">最早观察窗口：2028–2032（条件式）</text>

  <line x1="200" y1="564" x2="1510" y2="564" class="axis"/>
  <line x1="200" y1="564" x2="200" y2="72" class="axis"/>
  <path d="M194 84L200 72L206 84" fill="none" stroke="#64748b" stroke-width="2"/>

  <line x1="320" y1="74" x2="320" y2="564" class="grid"/>
  <line x1="568" y1="150" x2="568" y2="564" class="grid"/>
  <line x1="868" y1="150" x2="868" y2="564" class="grid"/>
  <line x1="1450" y1="74" x2="1450" y2="564" class="grid"/>

  <path d="M320 465 C430 458 500 425 568 365 C630 311 682 267 718 247 C770 216 812 184 868 154 C1040 94 1250 82 1450 80" class="current-line"/>
  <path d="M320 116 C430 134 500 157 568 181 C630 205 680 233 718 247 C775 278 814 317 868 350 C1040 431 1245 466 1450 484" class="orbital-line"/>

  <circle cx="718" cy="247" r="11" fill="#dc2626" stroke="#fff" stroke-width="5" filter="url(#shadow)"/>
  <rect x="625" y="273" width="186" height="42" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="718" y="295" class="callout-title" dominant-baseline="middle">边际部署速度追平</text>

  <text x="1130" y="112" class="route-label" fill="#c2410c">地面数据中心</text>
  <text x="1130" y="138" class="note">电力、并网与建设使新增容量变慢</text>
  <text x="1110" y="492" class="route-label" fill="#7c3aed">SpaceX 轨道计算</text>
  <text x="1110" y="518" class="note">制造与发射规模化使新增容量变快</text>

  <text x="142" y="118" class="direction">更慢</text>
  <text x="142" y="531" class="direction">更快</text>
  <text x="78" y="318" class="axis-label" transform="rotate(-90 78 318)">边际 Time-to-Compute</text>

  <line x1="320" y1="564" x2="320" y2="574" class="axis"/>
  <line x1="568" y1="564" x2="568" y2="574" class="axis"/>
  <line x1="868" y1="564" x2="868" y2="574" class="axis"/>
  <line x1="1450" y1="564" x2="1450" y2="574" class="axis"/>
  <text x="320" y="602" class="tick">10GW</text><text x="320" y="626" class="tick-sub">87.6TWh / 年</text>
  <text x="568" y="602" class="tick">30GW</text><text x="568" y="626" class="tick-sub">263TWh / 年</text>
  <text x="868" y="602" class="tick">50GW</text><text x="868" y="626" class="tick-sub">438TWh / 年</text>
  <text x="1450" y="602" class="tick">100GW</text><text x="1450" y="626" class="tick-sub">876TWh / 年</text>
  <text x="885" y="662" class="axis-label">OpenAI 目标算力容量</text>

  <line x1="492" y1="701" x2="552" y2="701" class="current-line"/><text x="570" y="707" class="legend">地面当前路径</text>
  <line x1="750" y1="701" x2="810" y2="701" class="orbital-line"/><text x="828" y="707" class="legend">轨道替代路径</text>
  <text x="800" y="739" class="footnote">容量换算假设全年满载；曲线表示复制速度的方向，不是成本或时间预测</text>
</svg>
